<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <style>
         body { width: 240px; padding: 12px; font: 13px/1.4 system-ui, sans-serif; }
         button { width: 100%; padding: 10px; font-size: 13px; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; background: #f6f6f6; }
         button:hover:not(:disabled) { background: #ececec; }
         button:disabled { cursor: default; opacity: 0.6; }
         button[data-state="on"] { border-color: #2e7d32; }
         p { margin: 10px 0 0; color: #666; }
        </style>
    </head>
    <body>
        <button id="toggle">Replace images on this site</button>
        <p id="note"></p>
        <script src="src/sites.js"></script>
        <script src="popup.js"></script>
    </body>
</html>
